[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 1. MangaDex Endpoints
[[redirects]]
  from = "/api/mangadex/search"
  to = "/.netlify/functions/mangadex-proxy?action=search"
  status = 200

[[redirects]]
  from = "/api/mangadex/chapters/:mangaId"
  to = "/.netlify/functions/mangadex-proxy?action=chapters&mangaId=:mangaId"
  status = 200

[[redirects]]
  from = "/api/mangadex/pages/:chapterId"
  to = "/.netlify/functions/mangadex-proxy?action=pages&chapterId=:chapterId"
  status = 200

[[redirects]]
  from = "/api/mangadex/image"
  to = "/.netlify/functions/mangadex-image"
  status = 200

# 2. Komikcast Endpoints
[[redirects]]
  from = "/api/komikcast/search"
  to = "/.netlify/functions/komikcast-proxy?action=search"
  status = 200

[[redirects]]
  from = "/api/komikcast/detail"
  to = "/.netlify/functions/komikcast-proxy?action=detail"
  status = 200

[[redirects]]
  from = "/api/komikcast/chapter"
  to = "/.netlify/functions/komikcast-proxy?action=chapter"
  status = 200

# 3. Jikan (MyAnimeList) Search
[[redirects]]
  from = "/api/jikan/search"
  to = "/.netlify/functions/jikan-proxy"
  status = 200

# 4. Google Drive Download & Image Proxies
[[redirects]]
  from = "/api/drive/download-pdf"
  to = "/.netlify/functions/drive-proxy"
  status = 200

[[redirects]]
  from = "/api/proxy-image"
  to = "/.netlify/functions/image-proxy"
  status = 200

# 5. SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
