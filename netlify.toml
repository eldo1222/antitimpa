[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# MangaDex API Proxy Routing
[[redirects]]
  from = "/api/mangadex/search*"
  to = "/.netlify/functions/mangadex-proxy"
  status = 200

[[redirects]]
  from = "/api/mangadex/chapters/:mangaId"
  to = "/.netlify/functions/mangadex-proxy?action=chapters&mangaId=:mangaId"
  status = 200

[[redirects]]
  from = "/api/mangadex/pages/:chapterId"
  to = "/.netlify/functions/mangadex-proxy?action=pages&chapterId=:chapterId"
  status = 200

[[redirects]]
  from = "/api/mangadex/*"
  to = "/.netlify/functions/mangadex-proxy"
  status = 200

# Jikan / MyAnimeList Proxy Routing
[[redirects]]
  from = "/api/jikan/search*"
  to = "/.netlify/functions/jikan-proxy"
  status = 200

[[redirects]]
  from = "/api/jikan/top*"
  to = "/.netlify/functions/jikan-proxy"
  status = 200

[[redirects]]
  from = "/api/jikan/*"
  to = "/.netlify/functions/jikan-proxy"
  status = 200

# Komikcast Scraper Routing
[[redirects]]
  from = "/api/komikcast/detail*"
  to = "/.netlify/functions/komikcast-proxy?action=detail"
  status = 200

[[redirects]]
  from = "/api/komikcast/chapter*"
  to = "/.netlify/functions/komikcast-proxy?action=chapter"
  status = 200

[[redirects]]
  from = "/api/komikcast/*"
  to = "/.netlify/functions/komikcast-proxy"
  status = 200

# Doujindesu 18+ Scraper Routing
[[redirects]]
  from = "/api/doujindesu/*"
  to = "/.netlify/functions/doujindesu-proxy"
  status = 200

# Image Proxy Routing
[[redirects]]
  from = "/api/proxy-image*"
  to = "/.netlify/functions/image-proxy"
  status = 200

# Background Scraper Status & Trigger Routing
[[redirects]]
  from = "/api/scraper/*"
  to = "/.netlify/functions/scraper-proxy"
  status = 200

# SPA Fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
