    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var activeFetch = origFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return activeFetch || origFetch; },
                set: function(fn) { if (typeof fn === 'function') { activeFetch = fn; } },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
